name: CLI timeout diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [0b81137330e52ea0cdd8fc7d54172550e921b7f6, a20ee400283f0e1ec99dbb5774ab2c56ffb2a04b]
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest tomli jsonschema --requirement deploy/mobile-relay/requirements.txt
      - name: Install tmux
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - name: Repeat exact failed tests and containing modules
        shell: bash
        env:
          TMPDIR: /tmp
        run: |
          result=0
          for attempt in $(seq 1 10); do
            echo "Attempt $attempt at $(git rev-parse HEAD)"
            python -m pytest -q --tb=short --durations=5 \
              test/test_mobile_gateway_terminal.py::test_host_terminal_manager_opens_isolated_persistent_home_shells \
              test/test_codex_app_server_followup.py::test_managed_pane_command_ignores_stale_socket_node || result=1
          done
          python -m pytest -q --tb=short --durations=10 \
            test/test_mobile_gateway_terminal.py test/test_codex_app_server_followup.py || result=1
          exit "$result"
